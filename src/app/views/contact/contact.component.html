<div class="container">
  <h2>Get in touch with me!</h2>

  <form class="form" *ngIf="false">
    <div class="name">
      <input
        type="text"
        id="name"
        name="name"
        required
        placeholder="Name"
        aria-label="Your Name"
      />
    </div>
    <div class="email">
      <input
        type="email"
        id="email"
        name="email"
        required
        placeholder="Email"
        aria-label="Your Email"
      />
    </div>
    <div class="message">
      <textarea
        id="message"
        name="message"
        required
        placeholder="Message"
        aria-label="Your Message"
      ></textarea>
    </div>
    <div class="submit">
      <button type="submit">Submit</button>
    </div>
  </form>

  <div class="contact-info">
    <div class="contact-info-sub">
      <div>Send an email to</div>
      <div style="display: flex">
        <a href="mailto:me@amcardle.dev"
          ><img
            src="../../../assets/icons/Email icon 64 (1).png"
            alt=""
            width="40"
          />
        </a>
      </div>
    </div>
    <h3>OR</h3>
    <div class="contact-info-sub" style="margin-top: 1rem;"></div>
    <div>Message me on any one of my socials down below</div>
  </div>
</div>
