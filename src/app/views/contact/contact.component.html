<div class="container">
  <h2>Get in touch with me!</h2>

  <form class="form">
    <div class="name">
      <input
        type="text"
        id="name"
        name="name"
        required
        placeholder="Name"
        aria-label="Your Name"
      />
    </div>
    <div class="email">
      <input
        type="email"
        id="email"
        name="email"
        required
        placeholder="Email"
        aria-label="Your Email"
      />
    </div>
    <div class="message">
      <textarea
        id="message"
        name="message"
        required
        placeholder="Message"
        aria-label="Your Message"
      ></textarea>
    </div>
    <div class="submit">
      <button type="submit">Submit</button>
    </div>
  </form>
</div>
