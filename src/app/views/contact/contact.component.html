<div class="container">
  <div>
    <h2>Get in touch with me!</h2>
  </div>
  <div></div>
  <div>
    <form>
      <div class="name">
        <input type="text" id="name" name="name" required placeholder="name" />
      </div>
      <div class="email">
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="email"
        />
      </div>
      <div class="message">
        <textarea
          id="message"
          name="message"
          required
          placeholder="message"
        ></textarea>
      </div>
      <div class="submit">
        <button type="submit">Submit</button>
      </div>
    </form>
  </div>
</div>
